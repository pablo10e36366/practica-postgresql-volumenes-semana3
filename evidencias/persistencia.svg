<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
<rect width="800" height="430" fill="#f3f7fb"/>
<g font-family="Arial, sans-serif" fill="#19334d">
<text x="28" y="34" font-size="23" font-weight="bold">Misma imagen, distinto almacenamiento</text>
<text x="28" y="59" font-size="14">Diagrama conceptual: los contenedores cambian; la reutilización del volumen decide el resultado.</text>
<rect x="28" y="84" width="744" height="143" rx="12" fill="#fff" stroke="#d9e2eb"/>
<text x="44" y="110" font-size="17" font-weight="bold">Prueba A · sin reutilizar almacenamiento</text>
<rect x="45" y="129" width="178" height="65" rx="6" fill="#e4ecf4"/>
<text x="60" y="154" font-size="16">server_db1 inicial</text><text x="60" y="177" font-size="14">Volumen anónimo A</text>
<path d="M231 159 H327" stroke="#da8952" stroke-width="3"/>
<text x="241" y="144" font-size="12">eliminar / crear</text>
<rect x="337" y="129" width="184" height="65" rx="6" fill="#fff0df"/>
<text x="350" y="154" font-size="16">server_db1 nuevo</text><text x="350" y="177" font-size="14">Volumen anónimo B</text>
<text x="545" y="153" font-size="16" font-weight="bold">test no aparece</text>
<text x="545" y="177" font-size="12">A sigue existiendo, sin montarse.</text>
<rect x="28" y="247" width="744" height="154" rx="12" fill="#fff" stroke="#d9e2eb"/>
<text x="44" y="274" font-size="17" font-weight="bold">Prueba B · reutilizando el volumen con nombre</text>
<rect x="45" y="291" width="178" height="65" rx="6" fill="#e4ecf4"/>
<text x="60" y="317" font-size="16">server_db2 inicial</text><text x="60" y="340" font-size="14">monta pgdata</text>
<path d="M232 323 H327" stroke="#087e8b" stroke-width="3"/>
<text x="242" y="308" font-size="12">eliminar / crear</text>
<rect x="337" y="291" width="184" height="65" rx="6" fill="#dff3ee"/>
<text x="350" y="317" font-size="16">server_db2 nuevo</text><text x="350" y="340" font-size="14">monta el mismo pgdata</text>
<text x="545" y="315" font-size="16" font-weight="bold">test y customer</text>
<text x="545" y="340" font-size="14">conservan los 2 registros.</text>
<text x="46" y="382" font-size="12">PostgreSQL 16 guarda sus datos en /var/lib/postgresql/data.</text>
</g></svg>
